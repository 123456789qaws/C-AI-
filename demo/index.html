<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna-for-C Demo | AI 辅助 C 语言教学</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 自定义样式 -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Monaco Editor Loader -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* Monaco 编辑器锁定区域样式 */
    .locked-line {
      background: rgba(115, 115, 115, 0.2) !important;
    }
    
    .lock-icon-glyph {
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23737373"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>') center center no-repeat;
      width: 20px;
      height: 20px;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 顶部导航栏 -->
    <header class="flex items-center justify-between px-4 py-2 bg-neutral-900 border-b border-neutral-700">
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2">
          <span class="text-xl">🌙</span>
          <span class="text-lg font-semibold text-white">Luna-C</span>
          <span class="text-xs text-neutral-400">Demo</span>
        </div>
        <span class="px-2 py-0.5 text-xs font-medium rounded bg-orange-500/20 text-orange-400 border border-orange-500/30">
          纯前端模拟·无后端
        </span>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- 进度点 -->
        <div id="progress-dots" class="progress-dots"></div>
        
        <!-- 教师视角切换 -->
        <div class="teacher-view-toggle">
          <span>教师视角</span>
          <div id="teacher-toggle" class="toggle-switch"></div>
        </div>
      </div>
    </header>
    
    <!-- 主内容区域 -->
    <div class="main-content">
      <!-- 左侧面板 - 检查点列表 -->
      <aside class="left-panel">
        <div class="panel-header">
          <h2>
            <span>📋</span>
            <span id="task-title">任务标题</span>
          </h2>
        </div>
        <div class="panel-content">
          <!-- 检查点列表 -->
          <div id="checkpoints-list"></div>
          
          <!-- 提示按钮 -->
          <button id="hint-btn" class="btn btn-ghost w-full mt-4">
            <span>💡</span>
            <span>获取提示</span>
          </button>
        </div>
      </aside>
      
      <!-- 中心编辑器区域 -->
      <main class="center-panel">
        <div class="editor-toolbar">
          <div class="flex items-center gap-2">
            <span class="text-sm text-neutral-400">main.c</span>
            <span class="badge badge-green">C</span>
          </div>
          
          <div class="flex items-center gap-2">
            <button id="verify-btn" class="btn btn-primary">
              <span>✓</span>
              <span>请求验证</span>
            </button>
            <button id="reset-btn" class="btn btn-secondary">
              <span>↺</span>
              <span>重置</span>
            </button>
          </div>
        </div>
        
        <div class="editor-container">
          <div id="monaco-editor" style="width: 100%; height: 100%;"></div>
        </div>
      </main>
      
      <!-- 右侧面板 - Luna 聊天 -->
      <aside class="right-panel">
        <div class="chat-header">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-lg">🌙</span>
              <span class="text-sm font-medium text-white">Luna AI</span>
            </div>
            <span class="text-xs text-neutral-400">Luna 只问不给</span>
          </div>
        </div>
        
        <div id="chat-messages" class="chat-messages"></div>
        
        <div class="chat-input-area">
          <textarea 
            id="chat-input" 
            class="chat-input" 
            rows="3" 
            placeholder="输入你的回答... (Enter 发送, Shift+Enter 换行)"
            maxlength="500"
          ></textarea>
          <div class="flex items-center justify-between mt-2">
            <div id="char-count" class="char-count">0/500</div>
            <button id="send-btn" class="btn btn-primary btn-sm">
              <span>发送</span>
            </button>
          </div>
        </div>
      </aside>
    </div>
    
    <!-- 底部状态栏 -->
    <footer class="flex items-center justify-between px-4 py-1 bg-neutral-900 border-t border-neutral-700 text-xs text-neutral-400">
      <div class="flex items-center gap-4">
        <span>Luna-for-C Demo v0.1.0</span>
        <span>Monaco Editor 0.52.0</span>
      </div>
      <div class="flex items-center gap-4">
        <span id="lock-status">🔒 编辑器部分区域已锁定</span>
        <button id="submit-btn" class="btn btn-primary btn-sm" disabled>
          <span>📤</span>
          <span>提交作业</span>
        </button>
      </div>
    </footer>
  </div>
  
  <!-- 隐藏测试面板（教师视角） -->
  <div id="hidden-tests-panel" style="display: none; position: fixed; bottom: 60px; right: 20px; background: var(--neutral-800); border: 1px solid var(--neutral-600); border-radius: 8px; padding: 16px; max-width: 300px; max-height: 400px; overflow-y: auto; z-index: 100;">
    <h3 class="text-sm font-semibold text-white mb-3">隐藏测试用例</h3>
    <table class="hidden-tests-table">
      <thead>
        <tr>
          <th>输入</th>
          <th>期望输出</th>
        </tr>
      </thead>
      <tbody id="hidden-tests-list"></tbody>
    </table>
  </div>
  
  <!-- Toast 容器 -->
  <div id="toast-container" class="toast-container"></div>
  
  <!-- 加载脚本 -->
  <script src="mockData.js"></script>
  <script src="app.js"></script>
</body>
</html>
